<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Search Browser</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1e1e2e; color: #fff; }
        .search-box { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 20px auto; }
        input { flex: 1; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #444; }
        button { padding: 10px 20px; font-size: 16px; background: #89b4fa; border: none; border-radius: 5px; cursor: pointer; }
        #results { width: 100%; height: 80vh; border: none; background: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="query" placeholder="Type search term...">
        <button onclick="search()">Search</button>
    </div>

    <!-- Embedded search page that allows framing -->
    <iframe id="results" src="https://start.duckduckgo.com/"></iframe>

    <script>
        function search() {
            const q = document.getElementById('query').value;
            if (q) {
                document.getElementById('results').src = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q);
            }
        }
    </script>
</body>
</html>
