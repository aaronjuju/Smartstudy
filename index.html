<script>
    const PROXY_URL = "https://my-proxy-backend.onrender.com/proxy?url=";

    function handleSearch() {
        const input = document.getElementById('urlInput').value.trim();
        if (!input) return;

        let target = input;
        if (!input.startsWith('http')) {
            target = 'https://www.bing.com/search?q=' + encodeURIComponent(input);
        }

        document.getElementById('browserFrame').src = PROXY_URL + encodeURIComponent(target);
    }
</script>
