<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f2f5;
        }
        /* Top Navigation/Search Bar */
        .browser-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #24292e;
            gap: 10px;
        }
        .browser-header input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 4px;
            outline: none;
        }
        .browser-header button {
            padding: 8px 16px;
            font-size: 14px;
            color: #ffffff;
            background-color: #2ea44f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .browser-header button:hover {
            background-color: #2c974b;
        }
        /* Embedded Webpage Window */
        .browser-window {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="browser-header">
        <input type="text" id="searchQuery" placeholder="Search with DuckDuckGo or enter URL..." />
        <button onclick="navigate()">Go</button>
    </div>

    <!-- Embedded frame acting as the browser view -->
    <iframe id="webFrame" class="browser-window" src="https://html.duckduckgo.com/html/"></iframe>

    <script>
        function navigate() {
            const input = document.getElementById('searchQuery').value.trim();
            const frame = document.getElementById('webFrame');

            if (!input) return;

            // Check if input is a direct URL or a search phrase
            if (input.startsWith('http://') || input.startsWith('https://')) {
                frame.src = input;
            } else if (input.includes('.') && !input.includes(' ')) {
                frame.src = 'https://' + input;
            } else {
                // Route query through DuckDuckGo HTML version
                frame.src = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
            }
        }

        // Allow pressing "Enter" to search
        document.getElementById('searchQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigate();
            }
        });
    </script>

</body>
</html>
