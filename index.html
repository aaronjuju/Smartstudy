<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartstudy Mini Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        /* Browser Header Bar */
        .browser-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #181825;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .browser-header input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            font-size: 15px;
            border: 1px solid #45475a;
            border-radius: 6px;
            outline: none;
            background-color: #313244;
            color: #ffffff;
        }
        .browser-header button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            background-color: #89b4fa;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .browser-header button:hover {
            background-color: #74c7ec;
        }
        /* Main Viewing Area */
        .viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #11111b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="browser-header">
        <input type="text" id="urlInput" placeholder="Enter full URL (https://...) or search topic..." />
        <button onclick="handleSearch()">Go</button>
        <button onclick="openExternal()" style="background-color: #f38ba8;">Open External Tab</button>
    </div>

    <div class="viewport">
        <!-- Bing allows framing on certain embedding modes, fallback to standard iframe -->
        <iframe id="browserFrame" src="https://www.bing.com"></iframe>
    </div>

    <script>
        function handleSearch() {
            let input = document.getElementById('urlInput').value.trim();
            const frame = document.getElementById('browserFrame');

            if (!input) return;

            // 1. If it's a direct URL starting with http:// or https://
            if (input.startsWith('http://') || input.startsWith('https://')) {
                frame.src = input;
            } 
            // 2. If it looks like a standard web address (e.g., example.com)
            else if (input.includes('.') && !input.includes(' ')) {
                frame.src = 'https://' + input;
            } 
            // 3. Search query: Use Bing or Google in frame (Note: If blocked, click 'Open External Tab')
            else {
                frame.src = 'https://www.bing.com/search?q=' + encodeURIComponent(input);
            }
        }

        function openExternal() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;

            if (input.startsWith('http://') || input.startsWith('https://')) {
                window.open(input, '_blank');
            } else if (input.includes('.') && !input.includes(' ')) {
                window.open('https://' + input, '_blank');
            } else {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(input), '_blank');
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>

</body>
</html>
